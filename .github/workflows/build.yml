name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Decode keystore
        run: |
          echo "${{ secrets.BUCCANEER_KEYSTORE_BASE64 }}" | base64 -d > buccaneer-release.keystore
          keytool -list -keystore buccaneer-release.keystore -storepass "${{ secrets.BUCCANEER_KEYSTORE_PASSWORD }}" | head -5

      - name: Build release APK
        run: |
          export BUCCANEER_KEYSTORE_PASSWORD="${{ secrets.BUCCANEER_KEYSTORE_PASSWORD }}"
          export BUCCANEER_KEY_PASSWORD="${{ secrets.BUCCANEER_KEY_PASSWORD }}"
          gradle assembleRelease --no-daemon

      - name: Verify APK
        run: |
          ls -la app/build/outputs/apk/release/
          # Verify the APK is signed
          apksigner verify app/build/outputs/apk/release/app-release.apk 2>/dev/null || \
            echo "apksigner not available, skipping verify"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "name=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Buccaneer ${{ steps.version.outputs.name }}
          body: |
            ## Buccaneer ${{ steps.version.outputs.name }}

            Signed release APK for Android TV / Fire TV.

            ### Install
            ```sh
            adb install Buccaneer-${{ steps.version.outputs.version }}.apk
            ```

            ### Changelog
            See [commits](https://github.com/BuccaneerBrowser/Buccaneer/commits/main).
